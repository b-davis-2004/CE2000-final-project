<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Version 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="nav nav-tabs" id="nav-tab" role="tablist">
            <button class="nav-link active" id="nav-home-tab" data-bs-toggle="tab" data-bs-target="#nav-home"
                type="button" role="tab" aria-controls="nav-home" aria-selected="true">Home</button>
            <button class="nav-link" id="nav-recommendations-tab" data-bs-toggle="tab"
                data-bs-target="#nav-recommendations" type="button" role="tab" aria-controls="nav-recommendations"
                aria-selected="false">Recommendations</button>
            <button class="nav-link" id="nav-contact-tab" data-bs-toggle="tab" data-bs-target="#nav-contact"
                type="button" role="tab" aria-controls="nav-contact" aria-selected="false">Contact</button>
        </div>
    </nav>

    <!-- each pages' content is generated within JS file and then called on by DOMContentLoader -->
    <!--Attempting to keep all of page content restricted to DOM content to avoid excessive writing within HTML file itself -->
    <!-- if you hate this, blame Mark Snaith. He gave me the green light -->
    <div class="tab-content" id="nav-tabContent">
        <div class="tab-pane fade show active" id="nav-home" role="tabpanel" aria-labelledby="nav-home-tab"
            tabindex="0">
            <div id="home-container"></div>
        </div>

        <div class="tab-pane fade" id="nav-recommendations" role="tabpanel" aria-labelledby="nav-recommendations-tab"
            tabindex="0">
            <div id="recommendations-container"></div>
        </div>

        <div class="tab-pane fade" id="nav-contact" role="tabpanel" aria-labelledby="nav-contact-tab" tabindex="0">
            <h3>Contact Us</h3>
            <p>Contact form or information can be placed here. Add your preferred contact method.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>

    <!-- calls doms on page load for home and recommendation  -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const recommendationsContainer = document.getElementById("recommendations-container");
            renderRecommendations(recommendationsContainer);
            const homeContainer = document.getElementById("home-container");
            renderHome(homeContainer);
        });
    </script>

</body>

</html>
